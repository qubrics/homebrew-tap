name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Tap local repository
        run: brew tap qubrics/tap "$GITHUB_WORKSPACE"

      - name: Trust formula under test
        run: brew trust --formula qubrics/tap/qubrics

      - name: Audit formula
        run: brew audit --strict qubrics/tap/qubrics

      - name: Check formula style
        run: brew style qubrics/tap/qubrics

      - name: Install formula
        run: HOMEBREW_NO_INSTALL_FROM_API=1 brew install --build-from-source qubrics/tap/qubrics

      - name: Test formula
        run: brew test qubrics/tap/qubrics

      - name: Read installed versions
        run: |
          qubrics --version
          sendmux --version
